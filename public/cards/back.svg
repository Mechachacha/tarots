<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#c9a84c" opacity="0.1"/>
      <circle cx="0" cy="0" r="2" fill="#c9a84c" opacity="0.1"/>
      <circle cx="40" cy="0" r="2" fill="#c9a84c" opacity="0.1"/>
      <circle cx="0" cy="40" r="2" fill="#c9a84c" opacity="0.1"/>
      <circle cx="40" cy="40" r="2" fill="#c9a84c" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="300" height="450" fill="url(#backBg)" rx="12"/>
  <rect width="300" height="450" fill="url(#pattern)" rx="12"/>
  <rect x="10" y="10" width="280" height="430" fill="none" stroke="#c9a84c" stroke-width="3" rx="8"/>
  <rect x="20" y="20" width="260" height="410" fill="none" stroke="#c9a84c" stroke-width="1" rx="6" stroke-dasharray="5,5"/>
  <text x="150" y="200" font-family="system-ui, sans-serif" font-size="48" fill="#c9a84c" text-anchor="middle" dominant-baseline="middle">🔮</text>
  <text x="150" y="270" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#c9a84c" text-anchor="middle" dominant-baseline="middle">TAROT</text>
  <text x="150" y="310" font-family="system-ui, sans-serif" font-size="16" fill="#c9a84c" text-anchor="middle" dominant-baseline="middle" opacity="0.7">タロット占い</text>
</svg>